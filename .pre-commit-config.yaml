---
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
      - id: terraform_providers_lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: briar
        name: Briar (offline secret scan)
        language: docker_image
        # Keep the image version and digest aligned with flake.nix.
        entry: ghcr.io/willfish/briar:v0.1.0@sha256:8e36caa3ef5892e45435d5388632d63f25e50224cee01678b82503eecc7cf728
        args: ["--"]
        types: [file]
        require_serial: true

  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
